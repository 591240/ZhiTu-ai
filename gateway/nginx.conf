# 知途 AI 旅行 —— 小程序唯一公网入口（纯 Nginx 反向代理，不含任何网页端产物）
# 链路：微信小程序 → 已备案域名(HTTPS，宿主机 Nginx 终止 TLS) → 本容器 → backend:8000
# 本容器只在 compose 里绑 127.0.0.1，不对公网直接开放。

# 外层宿主机 Nginx 已经终止 TLS，它送来的 X-Forwarded-Proto 必须原样透传，
# 不能被本容器的 $scheme(=http) 覆盖——否则后端推导出的头像链接会变成 http://，
# 小程序 https 页面下按混合内容拦截，头像加载不出来。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS：backend 容器重建后 IP 会变，静态 proxy_pass 只在启动时解析一次，
    # 会留下旧 IP 导致 502。这里用变量 + resolver 强制每次按域名重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 头像走 wx.uploadFile，20m 足够；3Mbps 机器不宜再放大
    client_max_body_size 20m;

    # Compose healthcheck 用，不做跳转
    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    # 流式问答（SSE）：必须关缓冲，否则 token 会被攒到超时才一次性吐出
    location /api/chat/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 行程生成：DeepSeek + 高德多次串行调用，耗时远高于普通接口
    location /api/plan/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # 头像永久链接由后端 /static 挂载提供（见 app/main.py），
    # 早期配置漏了这一条，网关后面头像会 404，必须一起反代。
    location /static/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 没有网页端，其余路径一律 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types application/json text/css image/svg+xml;
}
