# 知途 AI 旅行 —— 全栈 Docker Compose 部署
# 目标服务器：腾讯云轻量应用服务器 2 vCPU / 2 GB / 40 GB SSD / 3 Mbps
# 运行环境：Docker 27.5.1 / Compose v2 / Ubuntu Server 24.04 LTS
#
# 架构：
#   frontend(Nginx:80) ──反代 /api──> backend(FastAPI:8000，仅内网)
#   backend ──> mysql(3306，仅 127.0.0.1) / redis(6379，仅内网)
# 说明：用户端是微信小程序（微信平台托管，不进容器）；frontend 是运营/自检面板。

services:
  mysql:
    image: mysql:8.0
    container_name: zt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    # 限制内存相关参数，避免 2GB 机器被 MySQL 吃满
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
    volumes:
      - mysql_data:/var/lib/mysql
    # 仅绑定宿主机回环地址，供 Navicat 通过 SSH 隧道访问，禁止公网直连
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 800m
    mem_reservation: 600m
    cpus: 1.0
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: zt_redis
    restart: unless-stopped
    # 设置密码并硬性限制最大内存（LRU 淘汰），防止 OOM
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    mem_reservation: 160m
    cpus: 0.5
    networks:
      - backend_net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: zt_backend:latest
    container_name: zt_backend
    restart: unless-stopped
    env_file: .env
    # 以下变量优先于 .env，确保容器内连到 Compose 内部服务名
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # 12306 MCP 在容器内 127.0.0.1 不可达；留空走离线估算，避免无效连接
      TICKET_MCP_URL: ""
      UVICORN_WORKERS: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 不映射公网端口，仅对内网暴露
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zt_frontend:latest
    container_name: zt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    networks:
      - frontend_net

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
